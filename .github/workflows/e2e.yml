name: e2e

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.impeccable/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.impeccable/**']
  # Manual only: regenerates the Chromium visual baselines (see update-snapshots).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_DOCKER: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Manual only. Never runs on push or PR. Downloads the new baselines as an
  # artifact; commit them to e2e/__screenshots__ by hand. Native amd64, so no
  # E2E_EMULATED (that is only set by e2e/docker.sh).
  update-snapshots:
    if: github.event_name == 'workflow_dispatch'
    name: update-snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      E2E_DOCKER: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=chromium --grep @visual --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 14
