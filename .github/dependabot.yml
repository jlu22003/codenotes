# Weekly grouped dependency updates. The e2e workflow runs on every
# Dependabot PR; merge an update only when that run is green. (main has no
# required status checks, so a failing run does not block the merge.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      # TypeScript 7 (the native rewrite) has no classic `ts.sys`, which breaks
      # twoslash (Nextra's code-block highlighter) and fails the build. Drop
      # this once twoslash's typescript peer range includes ^7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
